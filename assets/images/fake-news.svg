<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0c2b45"/>
      <stop offset="100%" stop-color="#123a5e"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#57a2d5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#57a2d5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57a2d5"/>
      <stop offset="100%" stop-color="#0c446b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad5)"/>
  <rect width="800" height="450" fill="url(#glow5)"/>

  <!-- Real news article -->
  <g transform="translate(230,190)">
    <rect x="-110" y="-90" width="220" height="180" rx="14" fill="url(#paperGrad)" opacity="0.92"/>
    <rect x="-85" y="-60" width="170" height="18" rx="3" fill="#eaf4ff" opacity="0.85"/>
    <line x1="-85" y1="-28" x2="85" y2="-28" stroke="#eaf4ff" stroke-width="3" opacity="0.6"/>
    <line x1="-85" y1="-10" x2="85" y2="-10" stroke="#eaf4ff" stroke-width="3" opacity="0.5"/>
    <line x1="-85" y1="8" x2="60" y2="8" stroke="#eaf4ff" stroke-width="3" opacity="0.5"/>
    <line x1="-85" y1="26" x2="85" y2="26" stroke="#eaf4ff" stroke-width="3" opacity="0.4"/>
    <line x1="-85" y1="44" x2="40" y2="44" stroke="#eaf4ff" stroke-width="3" opacity="0.4"/>
    <g transform="translate(70,-58)">
      <circle r="16" fill="#1c7a4a"/>
      <path d="M -6 0 L -1 6 L 8 -7" fill="none" stroke="#eaf4ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="-108" text-anchor="middle" font-family="Outfit, sans-serif" font-size="14" font-weight="700" fill="#eaf4ff">Verified</text>
  </g>

  <!-- Fake news article -->
  <g transform="translate(570,190)">
    <rect x="-110" y="-90" width="220" height="180" rx="14" fill="#3a1f2e" stroke="#ff6b81" stroke-width="2"/>
    <rect x="-85" y="-60" width="170" height="18" rx="3" fill="#f5c6ce" opacity="0.5"/>
    <line x1="-85" y1="-28" x2="85" y2="-28" stroke="#f5c6ce" stroke-width="3" opacity="0.45"/>
    <line x1="-85" y1="-10" x2="85" y2="-10" stroke="#f5c6ce" stroke-width="3" opacity="0.4"/>
    <line x1="-85" y1="8" x2="60" y2="8" stroke="#f5c6ce" stroke-width="3" opacity="0.4"/>
    <line x1="-85" y1="26" x2="85" y2="26" stroke="#f5c6ce" stroke-width="3" opacity="0.35"/>
    <line x1="-85" y1="44" x2="40" y2="44" stroke="#f5c6ce" stroke-width="3" opacity="0.35"/>
    <g transform="translate(70,-58)">
      <circle r="16" fill="#7a1c2e" stroke="#ff6b81" stroke-width="2"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#ff9aa8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="6" y1="-6" x2="-6" y2="6" stroke="#ff9aa8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="-108" text-anchor="middle" font-family="Outfit, sans-serif" font-size="14" font-weight="700" fill="#ff9aa8">Flagged Fake</text>
  </g>

  <!-- Model core connecting both -->
  <g transform="translate(400,340)">
    <rect x="-105" y="-26" width="210" height="52" rx="14" fill="#0c1b2b" stroke="#57a2d5" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#eaf4ff">NLP Classifier</text>
  </g>
  <path d="M 230 280 Q 300 320 350 330" fill="none" stroke="#57a2d5" stroke-width="2.5" opacity="0.6"/>
  <path d="M 570 280 Q 500 320 450 330" fill="none" stroke="#ff6b81" stroke-width="2.5" opacity="0.6"/>

  <text x="400" y="50" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700"
        font-size="24" fill="#eaf4ff" letter-spacing="0.4">
    Fake News Detection System
  </text>
  <text x="400" y="415" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="500"
        font-size="13" fill="#8fb8de" letter-spacing="1">
    NLP · TEXT CLASSIFICATION · MISINFORMATION DETECTION
  </text>
</svg>
