<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0c2b45"/>
      <stop offset="100%" stop-color="#123a5e"/>
    </linearGradient>
    <radialGradient id="glow6" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#57a2d5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#57a2d5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164067"/>
      <stop offset="100%" stop-color="#0c1b2b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad6)"/>
  <rect width="800" height="450" fill="url(#glow6)"/>

  <!-- Video player frame -->
  <g transform="translate(280,210)">
