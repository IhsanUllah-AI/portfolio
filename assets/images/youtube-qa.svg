    <rect x="-140" y="60" width="170" height="6" rx="3" fill="#57a2d5"/>
    <circle cx="30" cy="63" r="8" fill="#8fd1ff"/>
    <text x="0" y="-70" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#8fb8de">timestamp 04:32</text>
  </g>

  <!-- Chat / Q&A bubble -->
  <g transform="translate(590,180)">
    <rect x="-110" y="-70" width="220" height="140" rx="16" fill="#0c1b2b" stroke="#8f6ff5" stroke-width="2"/>
    <circle cx="-80" cy="-40" r="10" fill="#8f6ff5"/>
    <line x1="-60" y1="-40" x2="80" y2="-40" stroke="#eaf4ff" stroke-width="2" opacity="0.6"/>
    <circle cx="-80" cy="-10" r="10" fill="#57a2d5"/>
    <line x1="-60" y1="-10" x2="60" y2="-10" stroke="#eaf4ff" stroke-width="2" opacity="0.45"/>
    <line x1="-60" y1="5" x2="40" y2="5" stroke="#eaf4ff" stroke-width="2" opacity="0.35"/>
    <circle cx="-80" cy="30" r="10" fill="#8f6ff5"/>
    <line x1="-60" y1="30" x2="70" y2="30" stroke="#eaf4ff" stroke-width="2" opacity="0.6"/>
  </g>

  <path d="M 380 220 Q 440 200 480 190" fill="none" stroke="#57a2d5" stroke-width="2.5" opacity="0.6" stroke-dasharray="4 6"/>

  <text x="400" y="50" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700"
        font-size="24" fill="#eaf4ff" letter-spacing="0.4">
    YouTube Video RAG QA Bot
