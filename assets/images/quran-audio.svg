<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0c2b45"/>
      <stop offset="100%" stop-color="#123a5e"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#57a2d5"/>
      <stop offset="100%" stop-color="#8f6ff5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#57a2d5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#57a2d5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Mel-spectrogram style grid blocks -->
  <g opacity="0.55">
    <!-- generated bar heights simulate a spectrogram -->
    <g fill="#57a2d5" opacity="0.18">
      <rect x="40" y="140" width="10" height="90"/>
      <rect x="55" y="110" width="10" height="150"/>
      <rect x="70" y="160" width="10" height="60"/>
      <rect x="85" y="90" width="10" height="200"/>
      <rect x="100" y="130" width="10" height="110"/>
      <rect x="115" y="70" width="10" height="230"/>
      <rect x="130" y="150" width="10" height="80"/>
      <rect x="145" y="100" width="10" height="170"/>
      <rect x="160" y="120" width="10" height="130"/>
      <rect x="175" y="80" width="10" height="210"/>
      <rect x="190" y="140" width="10" height="90"/>
      <rect x="205" y="105" width="10" height="160"/>
      <rect x="220" y="150" width="10" height="70"/>
      <rect x="235" y="95" width="10" height="190"/>
    </g>
  </g>

  <!-- Central waveform -->
  <path d="M 80 300 Q 140 220 200 300 T 320 300 T 440 300 T 560 300 T 680 300 T 800 300"
        fill="none" stroke="url(#waveGrad)" stroke-width="4" opacity="0.9"/>
  <path d="M 80 320 Q 150 380 220 320 T 360 320 T 500 320 T 640 320 T 780 320"
        fill="none" stroke="#8f6ff5" stroke-width="2.5" opacity="0.5"/>

  <!-- Central icon: open book / recitation mark -->
  <g transform="translate(400,190)">
    <circle r="62" fill="#0c446b" opacity="0.55"/>
    <circle r="62" fill="none" stroke="#57a2d5" stroke-width="2" opacity="0.7"/>
    <g stroke="#eaf4ff" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M -34 -18 L -34 24 Q -17 14 0 24 L 0 -18 Q -17 -28 -34 -18 Z"/>
      <path d="M 34 -18 L 34 24 Q 17 14 0 24 L 0 -18 Q 17 -28 34 -18 Z"/>
    </g>
  </g>

  <text x="400" y="400" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700"
        font-size="26" fill="#eaf4ff" letter-spacing="0.5">
    Reciter Identification &amp; Verse Classification
  </text>
  <text x="400" y="428" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="500"
        font-size="14" fill="#8fb8de" letter-spacing="1">
    WHISPER · LIBROSA · CNN · LSTM
  </text>
</svg>
