<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0c2b45"/>
      <stop offset="100%" stop-color="#123a5e"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#57a2d5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#57a2d5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57a2d5"/>
      <stop offset="100%" stop-color="#0c446b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)"/>
  <rect width="800" height="450" fill="url(#glow4)"/>

  <!-- Genuine review bubble -->
  <g transform="translate(230,180)">
    <rect x="-110" y="-60" width="220" height="120" rx="18" fill="url(#bubbleGrad)" opacity="0.9"/>
    <path d="M -30 60 L -10 60 L -20 90 Z" fill="url(#bubbleGrad)" opacity="0.9"/>
    <g transform="translate(0,-18)" fill="#ffd166">
      <text x="-64" y="10" font-size="22">★★★★★</text>
    </g>
    <line x1="-70" y1="14" x2="70" y2="14" stroke="#eaf4ff" stroke-width="2" opacity="0.6"/>
    <line x1="-70" y1="30" x2="40" y2="30" stroke="#eaf4ff" stroke-width="2" opacity="0.4"/>
    <text x="0" y="-38" text-anchor="middle" font-family="Outfit, sans-serif" font-size="14" font-weight="700" fill="#eaf4ff">Genuine</text>
  </g>

  <!-- Fake review bubble -->
  <g transform="translate(570,180)">
    <rect x="-110" y="-60" width="220" height="120" rx="18" fill="#3a1f2e" stroke="#ff6b81" stroke-width="2"/>
    <path d="M 30 60 L 10 60 L 20 90 Z" fill="#3a1f2e" stroke="#ff6b81" stroke-width="2"/>
    <g transform="translate(0,-18)" fill="#ff6b81">
      <text x="-64" y="10" font-size="22">★★★★★</text>
    </g>
    <line x1="-70" y1="14" x2="70" y2="14" stroke="#f5c6ce" stroke-width="2" opacity="0.5"/>
    <line x1="-70" y1="30" x2="40" y2="30" stroke="#f5c6ce" stroke-width="2" opacity="0.35"/>
    <text x="0" y="-38" text-anchor="middle" font-family="Outfit, sans-serif" font-size="14" font-weight="700" fill="#ff9aa8">Flagged Fake</text>
  </g>

  <!-- Model core connecting both -->
  <g transform="translate(400,330)">
    <rect x="-95" y="-26" width="190" height="52" rx="14" fill="#0c1b2b" stroke="#57a2d5" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#eaf4ff">RoBERTa + GRU</text>
  </g>
  <path d="M 230 240 Q 300 300 350 320" fill="none" stroke="#57a2d5" stroke-width="2.5" opacity="0.6"/>
  <path d="M 570 240 Q 500 300 450 320" fill="none" stroke="#ff6b81" stroke-width="2.5" opacity="0.6"/>

  <text x="400" y="50" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700"
        font-size="24" fill="#eaf4ff" letter-spacing="0.4">
    Fake Review Detection System
  </text>
  <text x="400" y="415" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="500"
        font-size="13" fill="#8fb8de" letter-spacing="1">
    ROBERTA · GRU · E-COMMERCE AUTHENTICITY
  </text>
</svg>
